name: bdia-project

services:
  landing:
    container_name: landing
    build:
      context: ./landing
      args:
        PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:${WEB_PORT:-5173}}
    ports:
      - "${LANDING_PORT:-4321}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    container_name: web
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:${API_PORT:-8000}/api}
        VITE_LANDING_URL: ${VITE_LANDING_URL:-http://localhost:${LANDING_PORT:-4321}}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5

  embeddings-api:
    container_name: embeddings-api
    build: ./embeddings
    environment:
      MODELO_EMBEDDING: ${MODELO_EMBEDDING:-intfloat/multilingual-e5-small}
    ports:
      - "127.0.0.1:${EMBEDDINGS_API_PORT:-8011}:8000"
    volumes:
      - student-project-model-cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/salud"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  api:
    container_name: api
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      ALPHA_ADMIN_EMAIL: ${ALPHA_ADMIN_EMAIL}
      ALPHA_MEMBER_EMAIL: ${ALPHA_MEMBER_EMAIL}
      ALPHA_VIEWER_EMAIL: ${ALPHA_VIEWER_EMAIL}
      BETA_ADMIN_EMAIL: ${BETA_ADMIN_EMAIL}
      BETA_MEMBER_EMAIL: ${BETA_MEMBER_EMAIL}
      BETA_VIEWER_EMAIL: ${BETA_VIEWER_EMAIL}
      FIXTURE_PASSWORD: ${FIXTURE_PASSWORD}
      RUNTIME_DATABASE_URL: "postgresql+psycopg://app_runtime:${APP_RUNTIME_PASSWORD:?set APP_RUNTIME_PASSWORD}@db:5432/student_project"
      AUTH_DATABASE_URL: "postgresql+psycopg://auth_runtime:${AUTH_RUNTIME_PASSWORD:?set AUTH_RUNTIME_PASSWORD}@db:5432/student_project"
      ASSISTANT_DATABASE_URL: "postgresql+psycopg://assistant_reader:${ASSISTANT_READER_PASSWORD:?set ASSISTANT_READER_PASSWORD}@db:5432/student_project"

      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-change-me-before-use}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-before-use}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: ${SMTP_FROM:-noreply@example.test}
      SESSION_SECRET: ${SESSION_SECRET:-local-session-secret-change-me}
      RECOVERY_TOKEN_SECRET: ${RECOVERY_TOKEN_SECRET:-local-recovery-secret-change-me}
      MODELO_EMBEDDING: ${MODELO_EMBEDDING:-intfloat/multilingual-e5-small}
      EMBEDDINGS_API_URL: http://embeddings-api:8000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      BACKEND_CORS_ORIGINS: '["http://localhost:${WEB_PORT:-5173}","http://localhost:${LANDING_PORT:-4321}"]'
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      demo-bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      embeddings-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://localhost:8000/health').read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    container_name: pgvector
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: student_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      PROJECT_MIGRATOR_PASSWORD: "${PROJECT_MIGRATOR_PASSWORD:?set PROJECT_MIGRATOR_PASSWORD}"
      APP_RUNTIME_PASSWORD: "${APP_RUNTIME_PASSWORD:?set APP_RUNTIME_PASSWORD}"
      AUTH_RUNTIME_PASSWORD: "${AUTH_RUNTIME_PASSWORD:?set AUTH_RUNTIME_PASSWORD}"
      ASSISTANT_READER_PASSWORD: "${ASSISTANT_READER_PASSWORD:?set ASSISTANT_READER_PASSWORD}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - student-project-postgres:/var/lib/postgresql/data
      - ./infra/postgres/00-create-roles.sh:/docker-entrypoint-initdb.d/00-create-roles.sh:ro
      - ./infra/postgres/01-ensure-platform-roles.sql:/opt/project/01-ensure-platform-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_migrator -d student_project"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-tools:
    build: ./backend
    profiles: ["admin-tools"]
    restart: "no"
    environment:
      MIGRATOR_DATABASE_URL: "postgresql+psycopg://project_migrator:${PROJECT_MIGRATOR_PASSWORD:?set PROJECT_MIGRATOR_PASSWORD}@db:5432/student_project"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-change-me-before-use}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-before-use}
      MINIO_BUCKET: student-assets
      ALPHA_ADMIN_EMAIL: ${ALPHA_ADMIN_EMAIL}
      ALPHA_MEMBER_EMAIL: ${ALPHA_MEMBER_EMAIL}
      ALPHA_VIEWER_EMAIL: ${ALPHA_VIEWER_EMAIL}
      BETA_ADMIN_EMAIL: ${BETA_ADMIN_EMAIL}
      BETA_MEMBER_EMAIL: ${BETA_MEMBER_EMAIL}
      BETA_VIEWER_EMAIL: ${BETA_VIEWER_EMAIL}
      FIXTURE_PASSWORD: ${FIXTURE_PASSWORD}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      MODELO_EMBEDDING: ${MODELO_EMBEDDING:-intfloat/multilingual-e5-small}
      EMBEDDINGS_API_URL: http://embeddings-api:8000
    volumes:
      - .:/workspace:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  demo-bootstrap:
    build: ./backend
    restart: "no"
    environment:
      MIGRATOR_DATABASE_URL: "postgresql+psycopg://project_migrator:${PROJECT_MIGRATOR_PASSWORD:?set PROJECT_MIGRATOR_PASSWORD}@db:5432/student_project"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-change-me-before-use}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-before-use}
      MINIO_BUCKET: student-assets
      ALPHA_ADMIN_EMAIL: ${ALPHA_ADMIN_EMAIL}
      ALPHA_MEMBER_EMAIL: ${ALPHA_MEMBER_EMAIL}
      ALPHA_VIEWER_EMAIL: ${ALPHA_VIEWER_EMAIL}
      BETA_ADMIN_EMAIL: ${BETA_ADMIN_EMAIL}
      BETA_MEMBER_EMAIL: ${BETA_MEMBER_EMAIL}
      BETA_VIEWER_EMAIL: ${BETA_VIEWER_EMAIL}
      FIXTURE_PASSWORD: ${FIXTURE_PASSWORD}
      MODELO_EMBEDDING: ${MODELO_EMBEDDING:-intfloat/multilingual-e5-small}
      EMBEDDINGS_API_URL: http://embeddings-api:8000
    volumes:
      - .:/workspace:ro
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      embeddings-api:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        alembic upgrade head
        python /workspace/scripts/seed-security-fixtures.py
        python /workspace/scripts/seed-tenant-documents.py

  db-role-reconcile:
    image: pgvector/pgvector:pg16
    profiles: ["db-role-reconcile"]
    restart: "no"
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      PROJECT_MIGRATOR_PASSWORD: "${PROJECT_MIGRATOR_PASSWORD:?set PROJECT_MIGRATOR_PASSWORD}"
      APP_RUNTIME_PASSWORD: "${APP_RUNTIME_PASSWORD:?set APP_RUNTIME_PASSWORD}"
      AUTH_RUNTIME_PASSWORD: "${AUTH_RUNTIME_PASSWORD:?set AUTH_RUNTIME_PASSWORD}"
      ASSISTANT_READER_PASSWORD: "${ASSISTANT_READER_PASSWORD:?set ASSISTANT_READER_PASSWORD}"
    volumes:
      - ./infra/postgres/01-ensure-platform-roles.sql:/opt/project/01-ensure-platform-roles.sql:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        for required in POSTGRES_PASSWORD PROJECT_MIGRATOR_PASSWORD APP_RUNTIME_PASSWORD AUTH_RUNTIME_PASSWORD ASSISTANT_READER_PASSWORD; do
          eval "value=\$${$$required-}"
          test -n "$$value" || { echo "credential contract rejected" >&2; exit 1; }
        done
        for left in POSTGRES_PASSWORD PROJECT_MIGRATOR_PASSWORD APP_RUNTIME_PASSWORD AUTH_RUNTIME_PASSWORD ASSISTANT_READER_PASSWORD; do
          eval "left_value=\$${$$left}"
          for right in POSTGRES_PASSWORD PROJECT_MIGRATOR_PASSWORD APP_RUNTIME_PASSWORD AUTH_RUNTIME_PASSWORD ASSISTANT_READER_PASSWORD; do
            test "$$left" = "$$right" && continue
            eval "right_value=\$${$$right}"
            test "$$left_value" != "$$right_value" || { echo "credential contract rejected" >&2; exit 1; }
          done
        done
        PGPASSWORD="$${POSTGRES_PASSWORD}" psql --host=db --username=postgres --dbname=student_project --file=/opt/project/01-ensure-platform-roles.sql

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:9.17
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - student-project-pgadmin:/var/lib/pgadmin
    healthcheck:
      test:
        [
          "CMD",
          "/venv/bin/python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1/misc/ping', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  minio:
    container_name: minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-change-me-before-use}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-before-use}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - student-project-minio:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc ready local || curl -fsS http://localhost:9000/minio/health/live",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    container_name: minio-init
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-change-me-before-use}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-before-use}
    entrypoint: >-
      /bin/sh -c 'mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && mc mb --ignore-existing local/student-assets && mc anonymous set none local/student-assets && touch /tmp/minio-initialized'
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/minio-initialized || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 1

  mailpit:
    container_name: mailpit
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/info >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  student-project-postgres:
  student-project-pgadmin:
  student-project-minio:
  student-project-model-cache:
