{% extends "base.html" %}
{% block content %}
<h1>Usuarios</h1>
<a class="btn" href="/users/new">+ Nuevo usuario</a>
<table>
    <thead>
        <tr><th>Username</th><th>Email</th><th>Creado</th><th>Acciones</th></tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.created_at }}</td>
            <td class="actions">
                <a href="/users/{{ user.id }}/edit">Editar</a>
                <form class="inline" method="post" action="/users/{{ user.id }}/delete" onsubmit="return confirm('¿Eliminar usuario?')">
                    <button class="btn-danger" type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
