{% extends "base.html" %}
{% block content %}
<h1>{{ "Editar" if content else "Nuevo" }} contenido</h1>
<form method="post" action="{{ '/content/' ~ content.id if content else '/content' }}">
    <label for="title">Título</label>
    <input type="text" id="title" name="title" value="{{ content.title if content else '' }}" required>

    {% if not content %}
    <label for="creator_id">Creador</label>
    <select id="creator_id" name="creator_id" required>
        <option value="">-- elegir creador --</option>
        {% for creator in creators %}
        <option value="{{ creator.id }}">{{ creator.username }}</option>
        {% endfor %}
    </select>
    {% endif %}

    <label for="category_id">Categoría</label>
    <select id="category_id" name="category_id" required>
        <option value="">-- elegir categoría --</option>
        {% for category in categories %}
        <option value="{{ category.id }}" {% if content and content.category_id == category.id %}selected{% endif %}>
            {{ category.name }}
        </option>
        {% endfor %}
    </select>

    <label for="content_type">Tipo</label>
    <select id="content_type" name="{{ 'content_type_display' if content else 'content_type' }}" onchange="showSubtypeFields()" {% if content %}disabled{% endif %} required>
        <option value="">-- elegir --</option>
        {% for value in ["video", "article", "post", "course", "document"] %}
        <option value="{{ value }}" {% if content and content.content_type == value %}selected{% endif %}>{{ value }}</option>
        {% endfor %}
    </select>
    {% if content %}
    <input type="hidden" name="content_type" value="{{ content.content_type }}">
    {% endif %}

    <fieldset id="fields-video" class="subtype-fields">
        <label for="video_url">URL del video</label>
        <input type="text" id="video_url" name="video_url" value="{{ subtype.video_url if subtype else '' }}">
        <label for="video_duration_seconds">Duración (segundos)</label>
        <input type="number" id="video_duration_seconds" name="duration_seconds" value="{{ subtype.duration_seconds if subtype else '' }}">
    </fieldset>

    <fieldset id="fields-article" class="subtype-fields">
        <label for="author">Autor</label>
        <input type="text" id="author" name="author" value="{{ subtype.author if subtype else '' }}">
        <label for="full_text">Texto completo</label>
        <textarea id="full_text" name="full_text">{{ subtype.full_text if subtype else '' }}</textarea>
    </fieldset>

    <fieldset id="fields-post" class="subtype-fields">
        <label for="body">Cuerpo del post</label>
        <textarea id="body" name="body">{{ subtype.body if subtype else '' }}</textarea>
        <label><input type="checkbox" name="is_pinned" style="width:auto;display:inline-block" {% if subtype and subtype.is_pinned %}checked{% endif %}> Fijado</label>
    </fieldset>

    <fieldset id="fields-course" class="subtype-fields">
        <label for="course_description">Descripción</label>
        <textarea id="course_description" name="description">{{ subtype.description if subtype else '' }}</textarea>
        <label for="total_modules">Total de módulos</label>
        <input type="number" id="total_modules" name="total_modules" value="{{ subtype.total_modules if subtype else '' }}">
    </fieldset>

    <fieldset id="fields-document" class="subtype-fields">
        <label for="file_format">Formato de archivo</label>
        <input type="text" id="file_format" name="file_format" value="{{ subtype.file_format if subtype else '' }}">
        <label for="file_size_kb">Tamaño (KB)</label>
        <input type="number" id="file_size_kb" name="file_size_kb" value="{{ subtype.file_size_kb if subtype else '' }}">
    </fieldset>

    <button type="submit">Guardar</button>
</form>

<script>
    function showSubtypeFields() {
        const select = document.getElementById("content_type");
        const selected = select.value;
        document.querySelectorAll(".subtype-fields").forEach(function (fieldset) {
            fieldset.style.display = fieldset.id === "fields-" + selected ? "block" : "none";
        });
    }
    showSubtypeFields();
</script>
{% endblock %}
