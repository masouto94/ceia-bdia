{% extends "base.html" %}
{% block content %}
<h1>Contenido</h1>
<a class="btn" href="/content/new">+ Nuevo contenido</a>
<table>
    <thead>
        <tr><th>Título</th><th>Tipo</th><th>Categoría</th><th>Acciones</th></tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td>{{ item.title }}</td>
            <td>{{ item.content_type }}</td>
            <td>{{ item.category_name or "" }}</td>
            <td class="actions">
                <a href="/content/{{ item.id }}/edit">Editar</a>
                <form class="inline" method="post" action="/content/{{ item.id }}/delete" onsubmit="return confirm('¿Eliminar contenido?')">
                    <button class="btn-danger" type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
