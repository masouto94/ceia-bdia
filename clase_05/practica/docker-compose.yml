name: bdia_clase_05

services:
  minio-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: bdia_clase05_minio_storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [bdia_network]

  minio-admin:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: bdia_clase05_minio_admin
    entrypoint: ["/bin/sh"]
    command: ["-c", "while true; do sleep 3600; done"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data:/data/practica:ro
      - ./scripts:/scripts:ro
    depends_on:
      minio-storage:
        condition: service_healthy
    networks: [bdia_network]

  postgres-warehouse:
    image: postgres:17.5-alpine3.21
    container_name: bdia_clase05_postgres_warehouse
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/01_crear_warehouse.sql:/docker-entrypoint-initdb.d/01_crear_warehouse.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [bdia_network]

  duckdb-transformer:
    build:
      context: .
      dockerfile: Dockerfile.duckdb
    image: bdia-duckdb:1.4.3
    container_name: bdia_clase05_duckdb_transformer
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["trap : TERM INT; sleep infinity & wait"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./duckdb_data:/workspace
      - ./duckdb:/sql:ro
      - ./scripts:/scripts:ro
    depends_on:
      minio-storage:
        condition: service_healthy
      postgres-warehouse:
        condition: service_healthy
    networks: [bdia_network]

  pgadmin-warehouse:
    image: dpage/pgadmin4:9.5
    container_name: bdia_clase05_pgadmin_warehouse
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./postgres:/home/pgadmin/postgres:ro
    depends_on:
      postgres-warehouse:
        condition: service_healthy
    networks: [bdia_network]

volumes:
  minio_data:
  postgres_data:
  pgadmin_data:

networks:
  bdia_network:
    driver: bridge
